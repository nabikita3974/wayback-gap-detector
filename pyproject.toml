[project]
name = "wayback-gap-detector"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
    "surt==0.3.1",
    "tqdm>=4.60.0",
    "urllib3>=1.26.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
